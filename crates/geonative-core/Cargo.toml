[package]
name = "geonative-core"
description = "Core data model and driver traits for the geonative geospatial library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
thiserror = "2"
geo-types = { version = "0.7", optional = true }

[features]
default = []
# Enable conversions between geonative-core types and the `geo-types` crate,
# unlocking the wider Rust geospatial ecosystem (algorithms in `geo`,
# format crates, PROJ wrappers). Z/M ordinates are silently dropped because
# `geo-types` is strictly 2D.
geo-types = ["dep:geo-types"]
