[package]
name = "geonative-cli"
description = "Command-line interface for the geonative geospatial library (installs the `geonative` binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[[bin]]
name = "geonative"
path = "src/main.rs"

[dependencies]
geonative-core = { version = "0.0.1", path = "../geonative-core" }
geonative-filegdb = { version = "0.0.1", path = "../geonative-filegdb" }
geonative-geoparquet = { version = "0.0.1", path = "../geonative-geoparquet" }
clap = { version = "4", features = ["derive"] }
