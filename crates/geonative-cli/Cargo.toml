[package]
name = "geonative-cli"
description = "Command-line interface for the geonative geospatial library (installs the `geonative` binary)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true
readme = "README.md"

[[bin]]
name = "geonative"
path = "src/main.rs"

[dependencies]
geonative-core = { workspace = true }
geonative-filegdb = { workspace = true }
geonative-geoparquet = { workspace = true }
geonative-shapefile = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
