name: release

# Tag-driven publish. Tag the repo with `v<semver>` (e.g. `v0.1.0`) to
# trigger a release. The workflow validates the workspace, then publishes the
# implemented crates to crates.io in dependency order, then creates a GitHub
# Release.
#
# Required secret: `CARGO_REGISTRY_TOKEN` (a token scoped to your crates.io
# account — settings → API Tokens → "Publish a new crate (with name)").
#
# Workflow design notes:
# - Crates publish strictly in dep order. Each step waits for the previous
#   crate to be queryable on the crates.io index before publishing the next
#   (avoids the classic "version not found" race).
# - **New-crate rate limit (10 min).** crates.io throttles first-time crate
#   names. Each crate gets its own `cargo publish || already_published` shim
#   so the workflow is idempotent — re-runs after a partial failure skip
#   the crates already at this version, and only the un-published ones
#   re-attempt.
# - **`workflow_dispatch`** is enabled so failed runs can be re-triggered
#   without re-pushing the tag.
# - The meta `geonative` umbrella crate is still pinned at 0.0.1 and
#   intentionally NOT published here. It'll be added when its feature-gated
#   re-exports stabilize.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to release from (e.g. v0.2.0)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets -- -D warnings

  publish:
    name: publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Idempotent publish helper.
      # - On successful publish: 30s index wait (existing crate) OR 600s
      #   (new crate name, to stay under crates.io's ~1-per-10-min new-crate
      #   rate limit). Caller passes `--new` to get the long sleep.
      # - On "crate version already uploaded": print + skip + no sleep.
      # - On any other error: fail.
      # Re-running the workflow against the same tag is safe: already-
      # published crates skip in seconds; only the un-published ones do
      # any real work (or wait).
      - name: Define publish helper
        run: |
          cat > /tmp/pub.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          name="$1"
          new_crate=${2:-""}
          echo "▶ Publishing $name..."
          out=$(cargo publish -p "$name" --no-verify 2>&1) && {
            echo "$out"
            if [[ "$new_crate" == "--new" ]]; then
              echo "⏳ New crate name — sleeping 600s for rate limit window"
              sleep 600
            else
              echo "⏳ Existing crate — 30s index settle"
              sleep 30
            fi
            exit 0
          }
          if echo "$out" | grep -qiE "already (uploaded|exists)"; then
            echo "✓ $name already at this version — skipping (no sleep)"
            exit 0
          fi
          echo "$out"
          exit 1
          EOF
          chmod +x /tmp/pub.sh

      # Layer 1: foundation (existing crate, just bumps in subsequent releases)
      - run: /tmp/pub.sh geonative-core

      # Layer 2: depend only on core. Mark `--new` for crate names that
      # have NEVER been published to crates.io before (first 0.x release).
      # After v0.2.0 these all become existing crates.
      - run: /tmp/pub.sh geonative-utils
      - run: /tmp/pub.sh geonative-tile
      - run: /tmp/pub.sh geonative-filegdb
      - run: /tmp/pub.sh geonative-shapefile
      - run: /tmp/pub.sh geonative-geojson
      - run: /tmp/pub.sh geonative-processing
      - run: /tmp/pub.sh geonative-proj --new

      # Layer 3: depend on layer 2
      - run: /tmp/pub.sh geonative-geoparquet
      - run: /tmp/pub.sh geonative-mvt --new
      - run: /tmp/pub.sh geonative-geotiff --new
      - run: /tmp/pub.sh geonative-image --new

      # Layer 4: orchestration — depends on every format crate
      - run: /tmp/pub.sh geonative-convert --new

      # Layer 5: binary
      - run: /tmp/pub.sh geonative-cli

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Resolve release tag
        id: tag
        run: |
          # On tag push, github.ref_name IS the tag. On workflow_dispatch,
          # it's the branch ('main'); use the explicit `ref` input instead.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
