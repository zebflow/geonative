[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# All 11 implemented crates inherit this version. The only crate that
# overrides is the meta `geonative` umbrella, which stays at 0.0.1 as a
# placeholder until its feature-gated re-export surface stabilises.
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zebflow/geonative"
homepage = "https://geonative.zebflow.com"
authors = ["Zebflow <hello@zebflow.com>"]
rust-version = "1.74"
categories = ["science::geo"]
keywords = ["geospatial", "gis", "geo"]

# Centralized inter-crate dependencies. Each crate references these via
# `geonative-core = { workspace = true }` so the version + path live in one
# place and stay in sync.
[workspace.dependencies]
geonative-core = { version = "0.2.0", path = "crates/geonative-core" }
geonative-filegdb = { version = "0.2.0", path = "crates/geonative-filegdb" }
geonative-geoparquet = { version = "0.2.0", path = "crates/geonative-geoparquet" }
geonative-tile = { version = "0.2.0", path = "crates/geonative-tile" }
geonative-mvt = { version = "0.2.0", path = "crates/geonative-mvt" }
geonative-utils = { version = "0.2.0", path = "crates/geonative-utils" }
geonative-shapefile = { version = "0.2.0", path = "crates/geonative-shapefile" }
geonative-geojson = { version = "0.2.0", path = "crates/geonative-geojson" }
geonative-processing = { version = "0.2.0", path = "crates/geonative-processing" }
geonative-convert = { version = "0.2.0", path = "crates/geonative-convert" }
geonative-proj = { version = "0.2.0", path = "crates/geonative-proj" }
